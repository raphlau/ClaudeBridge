[project]
name = "claude-bridge"
version = "1.0.0"
description = "Scoped file/notes access and Claude app control for Claude, via a custom connector"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "pymupdf>=1.24",
    "pillow>=10",
    "psutil>=5.9",
]

[tool.uv]
package = false
